log:
  level: "info"
  file: "/var/log/anchore-ecs-inventory.log"

anchore:
  url: http://localhost:8228
  user: admin
  password: foobar
  account: admin
  http:
    insecure: false
    timeout-seconds: 10

region: "us-east-1"

polling-interval-seconds: 60

quiet: true

health-report-interval-seconds: 120

anchore-registration:
  registration-id: "test-registration-id"
  registration-instance-id: "test-registration-instance-id"
  integration-name: "test-integration-name"
  integration-description: "test integration description"
