log:
  level: "info"
  file: "/var/log/anchore-ecs-inventory.log"

anchore:
  url: http://localhost:8228
  user: admin
  password: foobar
  account: admin
  http:
    insecure: false
    timeout-seconds: 10

region: "us-east-1"

assume-roles:
  - arn: "arn:aws:iam::111111111111:role/anchore-ecs-inventory"
    external-id: "test-external-id"
  - arn: "arn:aws:iam::222222222222:role/anchore-ecs-inventory"

polling-interval-seconds: 60

quiet: true
