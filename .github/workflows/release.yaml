name: 'Release'
on:
  push:
    # take no actions on push to any branch...
    branches-ignore:
      - '**'
    # ... only act on release tags
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  wait-for-checks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # we don't want to release commits that have been pushed and tagged, but not necessarily merged onto main
      - name: Ensure tagged commit is on main
        run: |
          echo "Tag: ${GITHUB_REF##*/}"
          git fetch origin main
          git merge-base --is-ancestor ${GITHUB_REF##*/} origin/main && echo "${GITHUB_REF##*/} is a commit on main!"

      - name: Build snapshot artifacts
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: snapshot
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/snapshot.yaml)
          checkName: "Build-Snapshot-Artifacts"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check static analysis
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: static-analysis
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/static-analysis.yaml)
          checkName: "Static-Analysis (ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check unit test results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: tests-unit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/unit-test.yaml)
          checkName: "Unit-Tests (ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Quality gate
        if: steps.static-analysis.outputs.conclusion != 'success' || steps.tests-unit.outputs.conclusion != 'success' || steps.snapshot.outputs.conclusion != 'success'
        run: |
          echo "Static-Analysis Status : ${STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION}"
          echo "Unit Test Status : ${STEPS_TESTS_UNIT_OUTPUTS_CONCLUSION}"
          echo "Build Snapshot Artifacts Status: ${STEPS_SNAPSHOT_OUTPUTS_CONCLUSION}"
          false
        env:
          STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION: ${{ steps.static-analysis.outputs.conclusion }}
          STEPS_TESTS_UNIT_OUTPUTS_CONCLUSION: ${{ steps.tests-unit.outputs.conclusion }}
          STEPS_SNAPSHOT_OUTPUTS_CONCLUSION: ${{ steps.snapshot.outputs.conclusion }}

  release:
    needs: [ wait-for-checks ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # required for goreleaser signs section with cosign
      id-token: write
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore bootstrap cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-
          lookup-only: true

      - name: Bootstrap dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: make ci-bootstrap

      - name: Login to Docker Hub
        id: docker-login
        run: |
          echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
        env:
          DOCKER_USER: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
          DOCKER_PASS: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

      # goreleaser picks the tag for a commit by reverse-lexicographic refname order, so a
      # bare vX.Y.Z tag always loses to a vX.Y.Z-rcN tag on the same commit. That would
      # silently rebuild and republish the RC instead of the final release. The workflow
      # already knows which tag it was triggered by, so pass it explicitly rather than
      # letting goreleaser guess.
      #
      # For a final release we also pin the changelog's starting point to the previous final
      # release. Left to itself goreleaser would start from the most recent RC, so the notes
      # would only cover commits landed after the last RC instead of the whole release.
      - name: Determine release tags
        id: release-tags
        run: |
          echo "current=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "${GITHUB_REF_NAME}" \
              | head -1)
            echo "Final release ${GITHUB_REF_NAME}; changelog starts from ${previous:-<none>}"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          else
            echo "Prerelease ${GITHUB_REF_NAME}; leaving changelog range to goreleaser"
          fi

      - name: Build snapshot artifacts
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release-tags.outputs.current }}
          # Empty is safe: goreleaser falls back to auto-detection.
          GORELEASER_PREVIOUS_TAG: ${{ steps.release-tags.outputs.previous }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: artifacts
          path: dist/**/*

  # RC only: once the RC image is built + published above, kick off the
  # downstream CircleCI e2e pipeline. GA tags skip this (a GA is only cut after
  # e2e passes). Called as a reusable workflow off the App-token tag push, so it
  # isn't suppressed the way a GITHUB_TOKEN release-event reaction would be.
  # promote=true → a passing e2e drives the GA. secrets: inherit lets the called
  # job resolve the e2e-environment CircleCI secrets.
  trigger-e2e:
    needs: [release]
    if: ${{ contains(github.ref_name, '-rc') }}
    uses: ./.github/workflows/trigger-circleci-e2e.yaml
    with:
      tag: ${{ github.ref_name }}
      promote: true
    secrets: inherit # zizmor: ignore[secrets-inherit] required to reach the e2e env secrets from the reusable workflow
